name: 💡 功能建议
description: 为 PopRaKo 前端提出范围明确的功能或改进建议。
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issues，避免重复建议。
        请围绕具体使用场景描述问题和期望行为。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程有什么困难？哪些用户或场景会受影响？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的行为
      description: 描述期望的操作流程和结果，以及如何判断问题得到解决。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 是否有其他方案或目前可用的绕过方式？

  - type: input
    id: page
    attributes:
      label: 涉及页面 / 功能（可选）
      placeholder: 例如：翻译工作台、漫画广场、个人工作区、成员一览、全局设置或通用功能。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息（可选）
      description: 可提供参考资料或截图；提交前请移除个人信息和凭据。
