name: 💡 功能建议
description: 提出一个新功能或改进建议。
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 在提交功能建议之前

        请确保你已经：

        - 在 [Issues](/poprako-dev/poprako-web/issues) 中搜索过，确认没有相同建议
        - 明确该建议是针对白杨子 W 前端平台的功能

        ---

  - type: textarea
    id: problem
    attributes:
      label: 🤔 要解决的问题
      description: 清晰描述你遇到了什么问题，或者目前的流程在哪一步有痛点。如果是单纯的"希望有这个功能"，也请说明你的使用场景。
      placeholder: |
        目前翻译时，如果有多行文本需要统一调整字体大小，只能逐行修改，非常耗时。
        我每天需要处理约 50 页漫画，这个重复操作占用了大量时间。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: ✅ 建议的方案
      description: 描述你期望的功能或改进，越具体越好。可以描述交互流程、UI 位置、预期效果等。
      placeholder: |
        希望能在翻译工具栏中增加"批量修改字体大小"功能：
        1. 框选（Shift+点击）多个文本单元
        2. 在右侧属性面板中统一调整字体大小
        3. 所有选中单元同步更新
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 考虑过的替代方案
      description: 你是否尝试过用其他方式绕过这个问题？有没有想到其他可以达到同样效果的实现方案？
      placeholder: 目前只能逐行修改，或者先导出数据用脚本批量处理再导入——但操作门槛太高。
    validations:
      required: false

  - type: dropdown
    id: page
    attributes:
      label: 📄 涉及页面 / 功能模块
      options:
        - 翻译工作台 (Translator Page)
        - 漫画工作区 (Comic Playground)
        - 工作组 (Workspace)
        - 成员管理 (Member List)
        - 设置 (Settings)
        - 登录 (Login)
        - 通用 / 全局
        - 其他（请在补充信息中说明）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 💬 补充信息
      description: 任何其他你想补充的内容——参考链接、竞品实现截图、使用数据等。
      placeholder: 类似功能可以参考 XXX 工具的实现（附链接）...
    validations:
      required: false
