name: 🐛 Bug 报告
description: 报告 PopRaKo 前端的可复现缺陷。
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issues，避免重复报告。
        安全漏洞请使用[私密安全报告](https://github.com/poprako-dev/poprako-web/security/advisories/new)，不要在公开 Issue 中披露。

  - type: input
    id: commit
    attributes:
      label: 受影响的 commit / 版本
      description: 填写已知的 commit SHA 或发布版本；无法确认时填写“不确定”，并提供使用地址和发生时间。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 浏览器与系统环境
      description: 请提供浏览器、操作系统及各自版本；仅在相关时补充网络或代理情况。
      placeholder: "例如：Chrome 版本号，Windows 11 / macOS 版本号。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 按顺序描述触发问题的操作；无法稳定复现时说明发生频率。
      placeholder: |
        1. 进入翻译页面 /translator/<chapterId>/<pageId>
        2. 输入翻译内容
        3. 描述之后的操作及问题出现时机
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有错误提示，请提供原文。
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: 涉及页面 / 功能
      options:
        - 翻译工作台
        - 审查工作台
        - 漫画广场
        - 个人工作区
        - 成员一览
        - 系统信箱
        - 实用工具
        - 全局设置
        - 登录
        - 其他（请在复现步骤中说明）
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: 相关角色（可选）
      description: 如与权限有关，请填写当前团队或章节的相关角色；可填写多个，也可说明不确定。
      placeholder: 图源、翻译、校对、嵌字、美工、监修、发布、管理

  - type: textarea
    id: log-file
    attributes:
      label: 诊断日志（可选）
      description: |
        能进入全局设置时，可在 /settings 点击“导出日志”，下载 poprako-web-log-<时间戳>.log。
        日志收集当前会话的控制台输出和未捕获异常，并尝试遮蔽可识别的敏感字段，不能保证完整脱敏。
        提交前请自行检查并移除凭据、个人信息和私有地址，只附上定位问题所需的片段或经过检查的文件。
        无法导出日志也可以提交报告；涉及安全漏洞请使用私密安全报告。

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏与补充信息（可选）
      description: 如有助于说明问题，可附截图或录屏；提交前请遮挡个人信息和凭据。
