name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  deployments: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: release

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up independent Node.js and pnpm
        run: sh script/setup-js.sh "$RUNNER_TEMP/poprako-js"

      - name: Verify successful production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/verify-release-deployment.ts "$GITHUB_SHA"

      - name: Run required checks
        env:
          VITE_API_BASE_URL: https://api.poprako.com/api/v1
        run: sh script/ci-check.sh

      - name: Audit dependencies
        run: sh script/ci-audit.sh

      - name: Build release artifacts
        env:
          RELEASE_DIR: ${{ runner.temp }}/poprako-web-release
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh script/ci-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/poprako-web-release
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$RELEASE_DIR"/*
          --notes-file "docs/release/${RELEASE_TAG#v}.md"
          --verify-tag
